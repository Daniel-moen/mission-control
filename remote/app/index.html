<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mission Control" />
  <meta name="theme-color" content="#111113" />
  <!-- Home Screen web app: display:standalone is what unlocks Web Push on iOS. -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Mission Control</title>
  <script>
    // A/B (task 0444): ?ui=v1|v2 picks this device's front end and it is
    // remembered (localStorage + the mc_ui cookie the relay reads to serve
    // v2.html at /). This covers the dev server and a cookie that went missing.
    (function () {
      try {
        var p = new URLSearchParams(location.search), q = p.get('ui');
        if (/^(v1|v2|v52?|v[34][abc])$/.test(q)) {
          localStorage.setItem('mc.ui', q);
          document.cookie = 'mc_ui=' + q + '; path=/; max-age=31536000; samesite=lax';
        }
        var ui = q || localStorage.getItem('mc.ui');
        if (ui === 'v2') return location.replace('/v2.html' + location.search + location.hash);
        if (/^(v[34][abc]|v52?)$/.test(ui)) return location.replace('/' + ui + location.search + location.hash); // task 0445/0446 directions, v5 (0483), v5.2 (0491)
        if (q) { p.delete('ui'); history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : '') + location.hash); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
